name: CI

# Runs on every push and pull request to main. Gates are ordered cheapest first,
# so a type error fails in under a minute rather than after the database is up.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration suite runs server actions against a real database — that
    # is the point of it, since every trust-chain rule is a database
    # interaction. `_test` in the name is not decoration: the suite refuses to
    # run against a database whose name does not end in it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bdaio
          POSTGRES_PASSWORD: bdaio
          POSTGRES_DB: bdaio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://bdaio:bdaio@localhost:5432/bdaio_test?schema=public
      AUTH_SECRET: ci-secret-not-used-for-anything-real
      APP_URL: https://bdaio.example

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, which needs the schema
      # but not a database — the generated client is committed, and this proves
      # the commit is in step with the schema.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Migrations, not `db push`: this also proves the migration history applies
      # cleanly to an empty database, which is exactly what a deploy does.
      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: npm test

  # Split from `check` on purpose: this one has to build the app and drive a
  # browser, so it takes minutes rather than seconds. A type error should not
  # wait behind it.
  browser:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bdaio
          POSTGRES_PASSWORD: bdaio
          POSTGRES_DB: bdaio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://bdaio:bdaio@localhost:5432/bdaio_test?schema=public
      DATABASE_URL: postgresql://bdaio:bdaio@localhost:5432/bdaio_test?schema=public
      AUTH_SECRET: ci-secret-not-used-for-anything-real
      APP_URL: http://127.0.0.1:3100
      PORT: "3100"
      HOSTNAME: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      # The browser tests need something to look at — an event to enrol on and
      # content on the public pages.
      - run: npm run db:seed

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (critical path + WCAG AA)
        run: npm run test:e2e

      - name: Performance budget
        run: npm run test:lighthouse

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
